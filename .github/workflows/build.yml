name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decompress project
        run: unzip -q projet.zip -d projet

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle
        run: |
          # Trouver où se situe le fichier settings.gradle ou build.gradle
          TARGET_DIR=$(find projet -maxdepth 2 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="projet"; fi
          echo "Building in directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NKI2SF2-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
